server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Hashed build assets (index-<hash>.js/css) are immutable — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Unhashed (stable-path) worker file — short cache so a future pdfjs-dist version bump
    # isn't served stale to returning visitors for up to a year.
    location = /pdf.worker.min.mjs {
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=3600";
    }

    # .mjs isn't in nginx's default mime.types, so it falls back to application/octet-stream —
    # browsers refuse to execute a dynamically-imported module served with that Content-Type
    # (e.g. the pdf.js worker). Regex locations take precedence over the /assets/ prefix above,
    # so this still applies to hashed worker files under /assets/.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the SPA shell, so a new deploy's bundle is picked up on the
    # next load without a manual hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Simple-chat WebSocket — must come before /api/ (longer prefix wins)
    location /api/chat/ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Session chat WebSocket — must come before /api/ (longer prefix wins)
    location /api/sessions/ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
